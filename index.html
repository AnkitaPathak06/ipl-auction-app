<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cricket IQ</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#15122E;--mu:#5E5A7A;--ac:#4F2FE0;--acs:#ECE8FF;--gr:#0F8A43;--grs:#E1F5E8;--rd:#C8202A;--rds:#FDE8E9;--am:#FFD23F;--ams:#FFF3C4;--bg:#F3F2FA;--bd:#E3E0F3;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;font-variant-numeric:tabular-nums}
button,select,input{font-family:inherit;font-size:15px;color:var(--ink)}
button{cursor:pointer}
b{font-weight:700}
.mu{color:var(--mu)}.gr{color:var(--gr)}.rd{color:var(--rd)}
.banner{background:var(--am);text-align:center;padding:5px 10px;font-size:12px;font-weight:700}
/* top */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;padding:8px 12px 10px}
.ar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ar .nm{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .lg{font-weight:800;letter-spacing:-.01em}.ar .lg i{font-style:normal;color:var(--am)}
.pills{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.pill{background:#2A2458;border-radius:12px;padding:6px 12px}
.pill small{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#C9C3F0}
.pill b{font-size:22px;line-height:1.1;font-weight:800}
.pill.m b{color:var(--am)}
/* shell */
.shell{max-width:1500px;margin:0 auto}
.main{padding:12px 12px 150px;min-width:0}
.pt{font-size:22px;font-weight:800;margin:4px 0 12px;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;min-width:0}
.card h3{margin:0 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mu)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:12px}
.cols{display:grid;gap:12px;grid-template-columns:1fr}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.tp{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:800;font-size:12px;min-width:36px;text-align:center}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);display:block;margin-bottom:4px}
.fld{height:46px;border:2px solid #C9C4E8;border-radius:12px;padding:0 12px;background:#fff;width:100%}
.fld:focus{outline:3px solid #D6CCFF;border-color:var(--ac)}
.btn{height:48px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-weight:800;padding:0 20px;font-size:16px}
.btn.g{background:var(--gr)}.btn.w{width:100%}
.btn2{height:44px;border:2px solid #C9C4E8;border-radius:12px;background:#fff;font-weight:700;padding:0 14px}
.btn2:disabled{opacity:.4}
.bar{height:8px;background:#E7E3F7;border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--ac);border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EFEDF8}
.row:last-child{border-bottom:0}
.al{display:flex;gap:8px;border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;align-items:flex-start}
.al b{min-width:60px;font-size:11px;letter-spacing:.05em;padding-top:2px}
.al.ok{background:var(--grs)}.al.ok b{color:var(--gr)}
.al.warn{background:var(--ams);border:1px solid #D9A800}.al.warn b{color:#7A5200}
.al.bad{background:var(--rds);border:1px solid var(--rd)}.al.bad b{color:var(--rd)}
/* bid page */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scroll-snap-type:x proximity;scrollbar-width:none}
.pc{flex:0 0 auto;scroll-snap-align:start;border:2px solid transparent;background:#fff;border-radius:14px;padding:8px 12px;text-align:left;min-width:112px;box-shadow:0 1px 0 var(--bd)}
.pc small{display:block;color:var(--mu);font-size:11px;font-weight:600}
.pc b{font-size:15px}
.pc.on{border-color:var(--ac);background:var(--acs)}
.pc.all{min-width:64px;display:flex;align-items:center;justify-content:center;background:var(--ac);color:#fff;font-weight:800}
.hero{border-radius:22px;padding:16px 18px 18px;color:#fff;display:flex;flex-direction:column;gap:2px}
.hero.bid{background:var(--gr)}.hero.skip{background:var(--rd)}
.hero .hr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .on{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.95}
.hero .badge{background:#fff;border-radius:999px;padding:3px 16px;font-weight:800;letter-spacing:.08em}
.hero.bid .badge{color:var(--gr)}.hero.skip .badge{color:var(--rd)}
.hero .pn{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
.hero .sub{opacity:.95;font-weight:600;font-size:13px}
.hero .lab{margin-top:10px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.hero .big{font-weight:800;line-height:.95;letter-spacing:-.04em;font-size:clamp(76px,24vw,128px)}
.hero .why{margin-top:6px;font-size:15px;font-weight:600;line-height:1.35}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:8px 12px}
.tile b{font-size:22px;font-weight:800;display:block;line-height:1.15}
.rp{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--bd);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;font-weight:700;background:#fff}
.rp.need{border-color:var(--ac);background:var(--acs)}.rp.out{opacity:.4}
.pk{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--bd);border-radius:18px;padding:12px 14px}
.pk .rk{width:28px;height:28px;border-radius:50%;background:var(--acs);color:var(--ac);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.pk .c{text-align:right;flex:none}.pk .c b{display:block;font-size:26px;color:var(--gr);line-height:1.05;letter-spacing:-.02em}
.tc{border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--bd)}
.tc .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;font-weight:800}
.tc .bd{padding:10px 14px}
/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:120px;padding:4px 2px}
.bub{border-radius:16px;padding:9px 13px;line-height:1.4;max-width:92%;font-size:14px}
.bub.me{align-self:flex-end;background:var(--ac);color:#fff;border-bottom-right-radius:4px;font-weight:600}
.bub.bot{background:#EFEDF9;border-bottom-left-radius:4px}
.pick{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;margin-top:6px;background:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;align-items:center}
.sug{flex:0 0 auto;border:2px solid #C9C4E8;background:#fff;color:var(--ac);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.sugs{display:flex;gap:6px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chatbox{display:flex;flex-direction:column;gap:6px;height:100%;min-height:0}
.cin{display:flex;gap:6px}
/* dock + nav (phone) */
.dock{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:40;padding:0 12px 8px;pointer-events:none}
.dock button{pointer-events:auto;width:100%;display:flex;align-items:center;gap:10px;background:var(--ac);color:#fff;border:0;border-radius:999px;height:48px;padding:0 18px;font-weight:700;box-shadow:0 6px 18px rgba(79,47,224,.35);text-align:left}
.dock span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bnav button,.rail button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--mu);font-size:11px;font-weight:700}
.bnav button.on{color:var(--ac)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail,.aside{display:none}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(21,18,46,.45);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-radius:22px 22px 0 0;max-height:88vh;display:flex;flex-direction:column;padding:8px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#D5D0EE;margin:0 auto 8px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet .sh b{font-size:18px}
.sheet .sb{overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:0}
.sheet.chat{height:82vh}
.toast{position:fixed;left:12px;right:12px;top:10px;z-index:90;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
/* login */
.login{min-height:calc(100vh - 25px);display:flex;flex-direction:column;background:var(--ink);color:#fff;padding:24px 18px 28px;gap:18px}
.login h2{font-size:clamp(44px,14vw,84px);line-height:.95;margin:0;letter-spacing:-.04em}
.tt{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tt button{border:3px solid transparent;border-radius:14px;padding:10px 0;font-weight:800;font-size:14px}
.tt button.on{border-color:#fff;box-shadow:0 0 0 3px var(--ac)}
/* desktop */
@media(min-width:1000px){
 body{font-size:15px}
 .shell{display:grid;grid-template-columns:200px minmax(0,1fr) 350px;gap:0}
 .top{display:flex;align-items:center;gap:24px;padding:8px 20px}.ar{margin:0;flex:1}.pills{width:460px}
 .rail{display:flex;flex-direction:column;gap:2px;padding:12px 10px;position:sticky;top:76px;height:calc(100vh - 76px);align-self:start}
 .rail button{flex-direction:row;gap:12px;padding:11px 14px;font-size:14px;border-radius:12px;text-align:left}
 .rail button:hover{background:#E9E6F8}.rail button.on{background:var(--acs);color:var(--ac)}
 .bnav,.dock{display:none}
 .main{padding:12px 16px 40px}
 .aside{display:block;position:sticky;top:84px;height:calc(100vh - 96px);margin:12px 12px 0 0;align-self:start}
 .aside .card{height:100%;display:flex;flex-direction:column;padding:12px}
 .cols.two{grid-template-columns:1fr 1fr}
 .cols.three{grid-template-columns:repeat(3,1fr)}
 .grid.g2{grid-template-columns:1fr 1fr}
 .hero .big{font-size:clamp(96px,9vw,140px)}
 .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(520px,92vw);border-radius:22px;max-height:84vh}
 .toast{left:50%;right:auto;transform:translateX(-50%);width:min(520px,92vw)}
 .login{flex-direction:row;align-items:stretch;padding:0}
 .login .a{flex:1;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
 .login .b{flex:1;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:40px}
}
/* ===== v5 additions ===== */
.snd{width:40px;height:40px;border-radius:12px;border:2px solid #4A4380;background:#2A2458;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.snd[aria-pressed=false]{color:#9892C8}
.bob{display:inline-flex;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
.fab{position:fixed;left:12px;bottom:72px;z-index:50;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ac);border-radius:999px;padding:3px 16px 3px 6px;box-shadow:0 8px 22px rgba(79,47,224,.35);font-weight:800;color:var(--ac)}
.fab.open{background:var(--ac);color:#fff}
.fab .fl{font-size:14px}
.cpanel{position:fixed;left:10px;right:10px;bottom:140px;height:min(66vh,520px);z-index:50;background:#fff;border:2px solid var(--ac);border-radius:20px;box-shadow:0 14px 40px rgba(21,18,46,.35);display:flex;flex-direction:column;padding:0 12px 12px;overflow:hidden;animation:rise .2s ease-out}
.cph{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);margin-bottom:8px}
.cph div{flex:1;display:flex;flex-direction:column;line-height:1.15}.cph small{color:var(--mu);font-size:12px}
.cpanel .chatbox{flex:1;min-height:0}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.bidtop{display:grid;gap:12px;grid-template-columns:1fr;align-items:stretch}
.bidtop>.stack{height:100%}
.card.fl{flex:1}
.pair{display:grid;gap:12px;grid-template-columns:1fr}
.cols.auto{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:stretch}
.cols.auto>.pk{flex-direction:column;justify-content:flex-start;gap:6px;padding:12px 14px}
.pk .t1{display:flex;align-items:center;gap:10px}
.pk .nm{flex:1;min-width:0}
.pk .c .lbl{font-size:10px;margin:0}
.pk .why{font-size:13px;line-height:1.35}
.tc{display:flex;flex-direction:column;padding:0;text-align:left;width:100%}
.tc .hd{width:100%;font-size:15px;min-height:44px}
.tc .bd{display:flex;flex-direction:column;gap:2px;flex:1}
.tc .more{margin-top:auto;padding-top:10px;color:var(--ac);font-weight:800;font-size:14px}
.sheet.big{width:min(680px,94vw)}
.hero .big{line-height:1.02;padding-bottom:.06em}
.hero .why{margin-top:12px}
.hero.pop .big{animation:pop .45s cubic-bezier(.2,1.6,.4,1);transform-origin:left bottom}
@keyframes pop{0%{transform:scale(.7);opacity:.2}100%{transform:none;opacity:1}}
.login .lf{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
#fx{position:fixed;inset:0;z-index:100;display:none;background:rgba(10,8,30,.64);cursor:pointer;animation:fin .3s}
#fx.on{display:block}
@keyframes fin{from{opacity:0}to{opacity:1}}
#fx canvas{position:absolute;inset:0;width:100%;height:100%}
.soldb{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:92vw;pointer-events:none;animation:slam .6s cubic-bezier(.2,1.5,.4,1) both}
.soldb small{display:block;font-size:clamp(16px,4vw,26px);font-weight:700;color:#FFD23F}
.soldb b{display:block;font-size:clamp(52px,16vw,150px);font-weight:800;letter-spacing:-.04em;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.5)}
.soldb span{display:block;font-size:clamp(18px,4.5vw,32px);font-weight:700}
.soldb.mine b{color:#FFD23F}
.soldb i{display:block;margin-top:14px;font-style:normal;font-size:12px;opacity:.7}
@keyframes slam{from{transform:translate(-50%,-50%) scale(2.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@media(max-width:999px){
 .login{gap:14px;padding:18px 16px 24px}
 .login h2{font-size:clamp(40px,12vw,84px)}
 .login .b{background:#fff;color:var(--ink);border-radius:20px;padding:18px}
}
@media(min-width:760px){.bidtop{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
@media(min-width:1000px){
 .shell{grid-template-columns:200px minmax(0,1fr)}
 .fab{left:20px;right:auto;bottom:76px}
 .cpanel{left:20px;right:auto;bottom:152px;width:380px;height:min(600px,calc(100vh - 250px))}
 .login .b{border-radius:0;padding:40px}
}
@media(prefers-reduced-motion:reduce){.bob,.hero.pop .big,.soldb,.cpanel,#fx{animation:none}}

@media(max-width:759px){.bidtop>.stack{display:contents}.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}}
@media(min-width:760px){.pair{grid-template-columns:1fr 1fr}}
/* landing */
.login{overflow:hidden}
.login .a{position:relative}
.hdline{display:flex;align-items:center;gap:10px}
.hdline .tag{font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#C9C3F0}
.appname{margin:0;display:flex;flex-direction:column;line-height:.92;letter-spacing:-.045em;font-weight:800;font-size:clamp(58px,17vw,120px)}
.appname span{display:block;animation:rise2 .7s cubic-bezier(.2,1.3,.4,1) both}
.appname .w1{color:var(--am);animation-delay:.05s}
.appname .w2{color:#fff;animation-delay:.2s}
.appname .w3{color:#fff;font-size:.62em;letter-spacing:-.03em;animation-delay:.35s}
@keyframes rise2{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.lead{margin:0;color:#C9C3F0;font-size:17px}
.scene{width:100%;max-width:560px;height:auto;border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.scene .lg1{animation:glow 2.4s ease-in-out infinite}.scene .lg2{animation:glow 2.4s ease-in-out infinite 1.2s}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.scene .ball{animation:hit 3.6s ease-in infinite}
@keyframes hit{0%{transform:translate(300px,150px) scale(.5);opacity:0}8%{transform:translate(300px,190px) scale(.7);opacity:1}30%{transform:translate(185px,238px) scale(1)}34%{transform:translate(185px,238px) scale(1)}70%{transform:translate(430px,40px) scale(.7) rotate(500deg);opacity:1}85%,100%{transform:translate(520px,10px) scale(.4) rotate(700deg);opacity:0}}
.scene .bat{transform-origin:130px 300px;animation:swing 3.6s ease-in-out infinite}
@keyframes swing{0%,24%{transform:rotate(-30deg)}33%{transform:rotate(28deg)}60%,100%{transform:rotate(-8deg)}}
.scene .stumps{animation:wob 3.6s infinite;transform-origin:300px 214px}
@keyframes wob{0%,70%{transform:none}74%{transform:rotate(1.5deg)}80%,100%{transform:none}}
.scene .sp path{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
.scene .sp .s2{animation-delay:.6s}.scene .sp .s3{animation-delay:1.1s}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.2);opacity:1}}
.scene .crowd circle{animation:cw 1.2s ease-in-out infinite}.scene .crowd circle:nth-child(even){animation-delay:.4s}
@keyframes cw{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hoot{display:flex;align-items:center;gap:10px;color:#C9C3F0}.hoot b{color:#fff}
.mus{display:flex;align-items:center;justify-content:center;gap:8px}
.mus svg{width:20px;height:20px}
@media(max-width:999px){.scene{max-width:none}.hoot{display:none}}
@media(prefers-reduced-motion:reduce){.scene *,.appname span{animation:none!important}}
.appname{padding-bottom:.1em}.lead{margin-top:4px}.tc .bd{padding:12px 14px}
.appname .w2{font-size:clamp(30px,8.6vw,48px);letter-spacing:-.03em;white-space:nowrap;line-height:1.05}@media(min-width:1000px){.appname .w2{font-size:clamp(34px,4vw,60px)}}
.lead{margin-bottom:14px}.scene{margin-top:8px}

.jr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.jr-spot{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#ffffff2e,transparent 55%);opacity:0;animation:jrf .6s .1s forwards}
.jr-j{position:relative;width:210px;opacity:0;transform:translateY(-220px) rotateY(180deg);animation:jrin 1.1s .15s cubic-bezier(.3,1.4,.5,1) forwards;overflow:hidden}
.jr-j svg{display:block;width:100%;filter:drop-shadow(0 12px 14px #0008)}
.jr-n{position:absolute;left:0;right:0;top:92px;text-align:center;font-weight:900;letter-spacing:.06em}
.jr-no{position:absolute;left:0;right:0;top:108px;text-align:center;font-weight:900;font-size:62px;line-height:1}
.jr-sh{position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#ffffff66 50%,transparent 60%);transform:translateX(-120%);animation:jrs .9s 1.2s forwards}
.jr-tag{position:relative;margin-top:2px;padding-top:12px;opacity:0;transform-origin:50% 0;animation:jrf .3s 1.1s forwards,jrsw 2.4s 1.1s ease-out}

/* ============ LOGIC ============ */
function teams(){
  return TEAMS.map(t=>{
    const rv=S.rival[t.id]||{},x=INIT[t.id];
    const o={...t,money:(t.id===S.me?S.budget:(rv.money!=null?rv.money:S.rules.purse)),spots:(rv.spots!=null?rv.spots:S.rules.squad),os:S.rules.os,have:x.have.slice()};
    S.sales.filter(s=>s[1]===t.id).forEach(s=>{const p=P[s[0]];o.money-=s[2];o.spots-=1;if(p.os)o.os-=1;o.have[p.ri]+=1;});
    if(o.id===S.me)S.extraRet.forEach(r=>{o.spots-=1;if(r.nat==='Overseas')o.os-=1;const j=ROLES.indexOf(r.role);if(j>=0)o.have[j]+=1;});
    o.money=Math.round(o.money*100)/100;return o;
  });
}
const reserve=t=>Math.max(0,t.spots-1)*S.rules.low;
const afford=(t,p)=>t.spots>0&&!(p.os&&t.os<=0)&&t.money-reserve(t)>=Math.max(p.fair,p.base);
const isUnsold=i=>!S.sales.some(s=>s[0]===i)&&!RET0.some(r=>r[0]===i)&&!S.extraRet.some(r=>r.pi===i);
const maxRet=()=>S.type==='Mega'?6:S.rules.squad;
function plan(me){
  const amt=S.pct.map(p=>S.budget*p/100),spent=[0,0,0,0,0];
  S.sales.filter(s=>s[1]===me.id).forEach(s=>{spent[P[s[0]].ri]+=s[2];});
  return {amt,spent,left:amt.map((a,k)=>a-spent[k])};
}
function wt(me,k){ // team weights: weak area gets a boost, strength is kept
  if(k===2)return 1.0;const weakBat=me.batRank>=me.bowlRank,isBat=k<=1,weak=isBat?weakBat:!weakBat;
  const w=me.posN>=7?[1.5,0.7]:me.posN<=4?[1.2,1.0]:[1.3,0.8];return weak?w[0]:w[1];
}
let TT=null;
const statFor=x=>{const ps=x.stats.split(' | ');if(x.ri<=1)return ps.find(s=>s.startsWith('SR'))||ps[0];if(x.ri>=3)return ps.find(s=>s.startsWith('econ'))||ps[0];return ps.join(' · ');};
const needs=(t,k)=>(t.have[k]-S.want[k]<0)&&(k===2||wt(t,k)>=1.2);
function ev(x,me,pl){
  const k=x.ri,rl=pl.left[k],role=x.role.toLowerCase(),art=/^[aeiou]/.test(role)?'an ':'a ';
  const pct=pl.amt[k]>0?Math.max(0,Math.round(rl/pl.amt[k]*100)):0,needed=me.have[k]<S.want[k];
  const safe=me.money-reserve(me);                       // keep enough for the other empty spots
  const cap=r05(Math.min(x.fair*1.15,safe));            // never more than 15% above fair price
  const w=wt(me,k),weak=w>=1.2&&k!==2,area=k<=1?'batting':'bowling';
  let skip=false,reason='',fit='Good fit',ceil=cap;
  if(me.spots<=0){skip=true;reason='Skip. Your squad is full.';}
  else if(x.os&&me.os<=0){skip=true;reason='Skip. Your overseas spots are full.';}
  else if(!needed){skip=true;reason='Skip. You already have all '+S.want[k]+' '+role+'s you planned.';}
  else if(rl<x.base){skip=true;reason='Skip. No plan budget left for '+art+role+'.';}
  else if(cap<x.base){skip=true;reason='Skip. Not enough money left after keeping '+fmt(reserve(me))+' for your other spots.';}
  else if(x.fair<x.base*0.8){skip=true;reason='Skip. His fair price ('+fmt(x.fair)+') is below his starting price ('+fmt(x.base)+').';}
  else if(rl<cap){fit='Tight fit';ceil=r05(Math.max(rl,x.base));}
  if(!skip){
    const rank=k<=1?me.batRank:me.bowlRank,riv=TT?TT.filter(t=>t.id!==me.id&&afford(t,x)&&needs(t,k)).length:0;
    const head=fit==='Tight fit'?'Tight fit. Good '+role+', but only '+fmt(rl)+' of your '+role+' plan is left.':'Good fit. Fills a gap: you have '+me.have[k]+' of '+S.want[k]+' '+role+'s.';
    const mid=weak?' Your '+area+' ranked '+ord(rank)+' of 10 last season.':(riv>=3?' '+riv+' rivals also need a '+role+'.':'');
    const form=x.exp<500?' Few IPL matches so far ('+statFor(x)+').':' IPL record: '+statFor(x)+'.';
    reason=head+mid+form;
  }
  if(skip)fit='No fit';
  return {skip,reason,fit,ceil,pct,rl,w};
}

/* ---------- PICKS ---------- */
function picksView(me,T,pl){
  const needs=ROLES.map((r,k)=>({r,g:S.want[k]-me.have[k]})).filter(x=>x.g>0);
  const tier=f=>f==='Good fit'?2:f==='Tight fit'?1:0;
  const rows=unsoldList().map(x=>({x,v:ev(x,me,pl)})).filter(o=>!o.v.skip).sort((a,b)=>tier(b.v.fit)*100+b.x.score*b.v.w-(tier(a.v.fit)*100+a.x.score*a.v.w)).slice(0,15);
  const tight=rows.filter(o=>o.v.fit!=='Good fit').length;
  return `<h1 class="pt">Recommendations</h1><div class="stack">
   <div class="card" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span>${ch('Good fit',CH.g)}</span><b>${tight?'Players are a good fit unless marked.':'All players below are a good fit for your plan.'}</b>
    <span class="mu" style="font-size:13px">Best first. You still need:</span>${needs.length?needs.map(n=>ch(n.r+' · '+n.g,CH.a)).join(''):'<b>nothing. Squad plan is full.</b>'}</div>
   <div class="cols auto">${rows.map((o,n)=>`<button class="pk" data-act="pick-bid" data-i="${o.x.i}">
     <div class="t1"><div class="rk">${n+1}</div><div class="nm"><b>${o.x.name}</b><div class="mu" style="font-size:12px">${o.x.role} · ${nat(o.x)} · score ${o.x.score}</div></div><div class="c"><span class="lbl" style="margin:0">Do not bid above</span><b>${fmt(o.v.ceil)}</b></div></div>
     <div class="why">${o.v.reason.replace(/^(Good fit|Tight fit)\. /,'')}</div>
     <div class="mu" style="font-size:12px">Starts ${fmt(o.x.base)} · Fair ${fmt(o.x.fair)} ${o.v.fit==='Good fit'?'':ch(o.v.fit,fitC(o.v.fit))}</div></button>`).join('')}</div>
   <div class="mu" style="font-size:12px">Tap a card to open that player in Bid.</div></div>`;
}
/* ---------- RIVALS ---------- */
function rivalsView(me,T){
  const p=P[S.pid],k=p.ri;
  return `<h1 class="pt">Rivals</h1><div class="stack"><div class="card" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>Showing who can bid on <b>${p.name}</b>. Tap a team to see all its details.</span><button class="btn2" data-act="tab" data-t="bid">Open player</button></div>
   <div class="cols auto">${T.map(t=>{const c=afford(t,p),n=needs(t,k),you=t.id===me.id;
    const tg=ROLES.map((r,j)=>({r,g:S.want[j]-t.have[j]})).sort((a,c2)=>c2.g-a.g).slice(0,2).filter(x=>x.g>0);
    return `<button class="tc" data-act="sheet" data-s="team" data-t="${t.id}" style="${c||you?'':'opacity:.7'}"><span class="hd" style="background:${t.color};color:${t.ink}"><span>${t.name}${you?' (you)':''}</span><span>${t.id}</span></span>
     <span class="bd"><span style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><span><span class="lbl" style="margin:0">Money left</span><b style="font-size:26px;letter-spacing:-.02em">${fmt(t.money)}</b></span><span>${you?ch('You',CH.b):c?(n?ch('Needs '+role1(p),CH.b):ch('Can bid',CH.g)):ch('Out',CH.r)}</span></span>
     <span style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0"><span><span class="lbl" style="margin:0">Spots</span><b>${t.spots}</b></span><span><span class="lbl" style="margin:0">Overseas</span><b>${t.os}</b></span><span><span class="lbl" style="margin:0">Last season</span><b>${t.pos}</b></span></span>
     <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="mu" style="font-size:12px">Likely to chase</span>${tg.map(x=>ch(x.r,CH.a)).join('')}</span>
     <span class="more">See all details ›</span></span></button>`}).join('')}</div></div>`;
}
const role1=p=>p.role.toLowerCase().split(' ')[0];

/* ---------- SQUAD ---------- */
function squadView(me,T,pl){
  const squadN=S.rules.squad-me.spots,osUsed=S.rules.os-me.os;
  const list=RET0.filter(r=>r[1]===me.id).map(r=>({name:P[r[0]].name,role:P[r[0]].role,nat:nat(P[r[0]]),how:'Retained',price:r[2]}))
   .concat(S.extraRet.map(r=>({name:r.name,role:r.role,nat:r.nat,how:'Retained',price:r.price})))
   .concat(S.sales.filter(s=>s[1]===me.id).map(s=>({name:P[s[0]].name,role:P[s[0]].role,nat:nat(P[s[0]]),how:'Bought',price:s[2]})));
  const more=Math.max(0,squadN-list.length);
  return `<h1 class="pt">My squad</h1><div class="stack"><div class="tiles" style="grid-template-columns:1fr 1fr">
   <div class="tile"><span class="lbl" style="margin:0">Squad size</span><b>${squadN}<span class="mu" style="font-size:13px"> / ${S.rules.squad}</span></b><div class="bar" style="margin-top:4px"><div style="width:${Math.min(100,squadN/S.rules.squad*100)}%"></div></div><small class="mu">Players in your team. Max ${S.rules.squad}.</small></div>
   <div class="tile"><span class="lbl" style="margin:0">Overseas</span><b>${osUsed}<span class="mu" style="font-size:13px"> / ${S.rules.os}</span></b><div class="bar" style="margin-top:4px"><div style="width:${Math.min(100,osUsed/S.rules.os*100)}%;background:#E8590C"></div></div></div></div>
   <div class="cols two">
    <div class="card"><h3>Players</h3>${list.map(b=>`<div class="row"><span><b>${esc(b.name)}</b><br><span class="mu" style="font-size:12px">${b.role} · ${b.nat}</span></span><span style="text-align:right">${ch(b.how,b.how==='Bought'?CH.g:CH.b)}<br><b>${fmt(b.price)}</b></span></div>`).join('')}<div class="mu" style="font-size:12px;padding-top:8px">Plus ${more} more squad players not added yet.</div></div>
    <div class="stack">
     <div class="card"><h3>Spend split: plan vs actual</h3>${ROLES.map((r,k)=>{const over=pl.spent[k]>pl.amt[k];return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${r} · ${S.pct[k]}%</b><span><b class="${over?'rd':''}">${fmt(pl.spent[k])}</b> <span class="mu">of ${fmt(pl.amt[k])}</span></span></div><div class="bar"><div style="width:${Math.min(100,pl.amt[k]?pl.spent[k]/pl.amt[k]*100:0)}%;background:${over?'var(--rd)':'var(--ac)'}"></div></div></div>`}).join('')}</div>
     <div class="card"><h3>Role gaps: have vs want</h3>${ROLES.map((r,k)=>{const h=me.have[k],w=S.want[k],g=w-h;return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b>${r}</b><span><b>${h} / ${w}</b> <b class="${g>0?'rd':'gr'}" style="font-size:12px">${g>0?'Need '+g:'Full'}</b></span></div><div class="bar"><div style="width:${w?Math.min(100,h/w*100):0}%;background:${g>0?'var(--ac)':'var(--gr)'}"></div></div></div>`}).join('')}</div>
    </div></div></div>`;
}

/* ---------- RECORD ---------- */
function recordView(me,T){
  return `<h1 class="pt">Record a sale</h1><div class="cols two" style="align-items:start"><div class="card">${saleForm(T,true,'rc')}</div>
   <div class="card"><h3>Sales so far · ${S.sales.length}</h3>${S.sales.slice().reverse().map((s,n)=>{const t=TEAMS.find(x=>x.id===s[1]);return `<div class="row"><span><b>${S.sales.length-n}. ${P[s[0]].name}</b><br><span class="mu" style="font-size:12px">${tpS(t)} · started ${fmt(P[s[0]].base)}</span></span><b style="font-size:17px">${fmt(s[2])}</b></div>`}).join('')}</div></div>`;
}

/* ---------- PLAYERS ---------- */
function playersView(me,T){
  const rows=P.filter(x=>(S.fRole==='All'||x.role===S.fRole)&&(S.fNat==='All'||nat(x)===S.fNat)&&x.fair<parseFloat(S.fPrice)&&(x.age==null||x.age<parseFloat(S.fAge)));
  const tag=x=>x.i===S.pid?['On the block',CH.a]:isUnsold(x.i)?['Unsold',CH.g]:['Sold',CH.b];
  const A=P[S.cA],B=P[S.cB],vA=A.score/A.fair,vB=B.score/B.fair,g='#DDF3E4',n='transparent';
  const cmp=[['Role',A.role,B.role,n,n],['From',nat(A),nat(B),n,n],['Age',A.age==null?'n/a':A.age,B.age==null?'n/a':B.age,A.age!=null&&(B.age==null||A.age<=B.age)?g:n,B.age!=null&&(A.age==null||B.age<=A.age)?g:n],['Score',A.score,B.score,A.score>=B.score?g:n,B.score>=A.score?g:n],['Form',A.form,B.form,n,n],['Starts',fmt(A.base),fmt(B.base),n,n],['Fair',fmt(A.fair),fmt(B.fair),A.fair<=B.fair?g:n,B.fair<=A.fair?g:n],['Score per cr',vA.toFixed(1),vB.toFixed(1),vA>=vB?g:n,vB>=vA?g:n]];
  const sel=(id,key,val,lab,opts)=>`<div><label class="lbl" for="${id}">${lab}</label><select id="${id}" class="fld" data-in="${key}">${opts.map(o=>`<option value="${o[0]}" ${String(val)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>`;
  const allP=P.map(x=>[String(x.i),x.name+' · '+x.role]);
  return `<h1 class="pt">Players</h1><div class="stack">
   <div class="card"><h3>Compare two players</h3>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">${sel('ca','cA',S.cA,'Player 1',allP)}${sel('cb','cB',S.cB,'Player 2',allP)}</div>
    <div style="display:grid;grid-template-columns:.8fr 1fr 1fr;gap:4px;align-items:center"><span></span><b style="text-align:center;color:var(--ac);font-size:13px">${sn(A.name)}</b><b style="text-align:center;color:#B8420A;font-size:13px">${sn(B.name)}</b>
    ${cmp.map(c=>`<span class="lbl" style="margin:0">${c[0]}</span><span style="background:${c[3]};padding:5px;text-align:center;border-radius:8px"><b>${c[1]}</b></span><span style="background:${c[4]};padding:5px;text-align:center;border-radius:8px"><b>${c[2]}</b></span>`).join('')}</div><div class="mu" style="font-size:12px;margin-top:6px">Green = better value. You can also tap Compare on a player below.</div></div>
   <div class="card"><h3>Filter players</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">${sel('f1','fRole',S.fRole,'Role',[['All','All roles']].concat(ROLES.map(r=>[r,r])))}${sel('f2','fNat',S.fNat,'From',[['All','Indian + Overseas'],['Indian','Indian'],['Overseas','Overseas']])}${sel('f3','fPrice',S.fPrice,'Fair price',[['99','Any price'],['3','Under 3 cr'],['5','Under 5 cr'],['7','Under 7 cr']])}${sel('f4','fAge',S.fAge,'Age',[['99','Any age'],['25','Under 25'],['30','Under 30'],['34','Under 34']])}</div></div>
   <div class="card"><h3>${rows.length} of ${P.length} players${rows.length>80?' (showing 80)':''}</h3><div class="cols auto" style="gap:0 24px">${rows.slice(0,80).map(x=>{const t=tag(x);return `<div class="row"><span style="min-width:0"><b>${x.name}</b><br><span class="mu" style="font-size:12px">${x.role} · ${nat(x)} · ${ageS(x)} · score ${x.score} · fair ${fmt(x.fair)}</span></span><span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">${ch(t[0],t[1])}<button class="btn2" data-act="cmp" data-i="${x.i}" style="height:30px;font-size:12px;padding:0 10px">Compare</button></span></div>`}).join('')||'<div class="mu">No players match these filters.</div>'}</div></div></div>`;
}
/* ---------- SETUP ---------- */
function setupView(me){
  const pctTotal=S.pct.reduce((a,b)=>a+b,0),wantTotal=S.want.reduce((a,b)=>a+b,0),okPct=pctTotal===100;
  const ret=RET0.filter(r=>r[1]===me.id).map(r=>({name:P[r[0]].name,role:P[r[0]].role,nat:nat(P[r[0]]),price:r[2]})).concat(S.extraRet.map((r,x)=>({...r,x})));
  const inp=(id,key,val,label)=>`<div><label class="lbl" for="${id}">${label}</label><input id="${id}" class="fld" data-in="${key}" value="${val}" inputmode="decimal"></div>`;
  return `<h1 class="pt">Setup</h1><div class="cols two" style="align-items:start">
   <div class="stack"><div class="card stack" style="gap:10px"><h3>1. Team and auction</h3><div><label class="lbl" for="su1">My team</label><select id="su1" class="fld" disabled><option>${me.name}</option></select></div>
    <div><span class="lbl">Auction type</span><div class="grid" style="grid-template-columns:1fr 1fr">${['Mega','Mini'].map(t=>`<button data-act="type" data-t="${t}" class="btn2" style="${S.type===t?'background:var(--ac);border-color:var(--ac);color:#fff':''}">${t}</button>`).join('')}</div></div>
    <span class="lbl" style="margin:0">Rules (you can edit)</span><div class="grid" style="grid-template-columns:1fr 1fr">${inp('r1','rPurse',S.rules.purse,'Total purse (cr)')}${inp('r2','rSquad',S.rules.squad,'Squad size (18-25)')}${inp('r3','rOs',S.rules.os,'Max overseas')}${inp('r4','rLow',S.rules.low,'Lowest start (cr)')}</div></div>
    <div class="card"><h3>Last season</h3><div style="display:flex;gap:28px"><div><span class="lbl">Table position</span><b style="font-size:28px">${me.pos}</b></div><div><span class="lbl">Wins</span><b style="font-size:28px">${me.w}</b></div><div><span class="lbl">Losses</span><b style="font-size:28px">${me.l}</b></div></div>
     <div class="al ok" style="margin-top:10px"><b>WEAKER AREA</b><span>${me.batRank>=me.bowlRank?'Batting':'Bowling'} (batting ${ord(me.batRank)}, bowling ${ord(me.bowlRank)} of 10 on runs per over). Players for it get a boost.</span></div></div>
    <div class="card stack" style="gap:10px"><h3>Other teams (optional)</h3><div class="mu" style="font-size:12px">Type each rival's money and spots after their retentions. Empty means full purse and a full squad.</div>
     <div style="display:grid;grid-template-columns:.7fr 1fr 1fr;gap:6px;align-items:center"><span class="lbl" style="margin:0">Team</span><span class="lbl" style="margin:0">Money (cr)</span><span class="lbl" style="margin:0">Spots</span>
     ${TEAMS.filter(t=>t.id!==me.id).map(t=>{const v=S.rival[t.id]||{};return `<b>${t.id}</b><input class="fld" data-in="rm_${t.id}" value="${v.money!=null?v.money:''}" placeholder="${S.rules.purse}" inputmode="decimal" aria-label="${t.id} money" style="text-align:center"><input class="fld" data-in="rs_${t.id}" value="${v.spots!=null?v.spots:''}" placeholder="${S.rules.squad}" inputmode="numeric" aria-label="${t.id} spots" style="text-align:center">`}).join('')}</div></div></div>
   <div class="stack"><div class="card stack" style="gap:10px"><h3>2. My plan</h3><div><label class="lbl" for="pb">Budget left after retentions (cr)</label><input id="pb" class="fld" data-in="budget" value="${S.budget}" inputmode="decimal" style="font-size:20px;font-weight:800"></div>
    <span class="lbl" style="margin:0">Retained players · ${S.extraRet.length} of ${maxRet()} allowed${S.type==='Mega'?' (Mega auction: max 6)':''}</span>${S.extraRet.length>maxRet()?`<div class="al bad" role="alert"><b>FIX</b><span>Too many retained players for a ${S.type} auction. Remove ${S.extraRet.length-maxRet()}.</span></div>`:''}<div>${ret.map(r=>`<div class="row"><span><b>${esc(r.name)}</b><br><span class="mu" style="font-size:12px">${r.role} · ${r.nat}</span></span><span style="display:flex;align-items:center;gap:8px"><b>${fmt(r.price)}</b>${r.x!==undefined?`<button class="btn2" data-act="delret" data-x="${r.x}" aria-label="Remove ${esc(r.name)}" style="height:32px;padding:0 10px">Remove</button>`:''}</span></div>`).join('')}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr"><datalist id="pn">${P.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist><input id="rn" list="pn" class="fld" placeholder="Name" value="${esc(S.rf.n)}" aria-label="Retained player name"><select id="rr" class="fld" aria-label="Role">${ROLES.map(r=>`<option ${S.rf.r===r?'selected':''}>${r}</option>`).join('')}</select><select id="rt" class="fld" aria-label="Nationality">${['Indian','Overseas'].map(n=>`<option ${S.rf.t===n?'selected':''}>${n}</option>`).join('')}</select><input id="rp" class="fld" placeholder="Price (cr)" value="${esc(S.rf.p)}" inputmode="decimal" aria-label="Price"></div>${S.retErr?`<div class="al bad" role="alert"><b>FIX</b><span>${S.retErr}</span></div>`:''}<button class="btn2" data-act="addret">Add retained player</button></div>
    <div class="card stack" style="gap:10px"><h3>3. Target roles and spend split</h3><div style="display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:8px;align-items:center"><span class="lbl" style="margin:0">Role</span><span class="lbl" style="margin:0">How many</span><span class="lbl" style="margin:0">Spend %</span>
     ${ROLES.map((r,k)=>`<b>${r}</b><input class="fld" data-in="want${k}" value="${S.want[k]}" aria-label="${r} how many" style="text-align:center;font-weight:700"><input class="fld" data-in="pct${k}" value="${S.pct[k]}" aria-label="${r} spend percent" style="text-align:center;font-weight:700">`).join('')}
     <span class="lbl" style="margin:0">Total</span><b style="text-align:center">${wantTotal}</b><b style="text-align:center" class="${okPct?'gr':'rd'}">${pctTotal}%</b></div>
     <div class="al ${okPct?'ok':'bad'}"><b>${okPct?'OK':'FIX'}</b><span>${okPct?'Spend split adds up to 100%. Good.':'Spend split must add to 100%. It is '+pctTotal+'% now.'}</span></div>
     ${wantTotal>S.rules.squad?`<div class="al warn"><b>WARNING</b><span>Target roles add up to ${wantTotal}, more than the squad size of ${S.rules.squad}.</span></div>`:''}
     ${S.doneErr?`<div class="al bad" role="alert"><b>FIX</b><span>${S.doneErr}</span></div>`:''}<button class="btn w" data-act="done">Done, start bidding</button></div></div></div>`;
}

/* ---------- MORE (phone menu) ---------- */
function moreView(){
  const it=[['record','Record a sale','Save a sale, undo, see all sales'],['players','Players','Filter all players and compare'],['setup','Setup','Rules, budget, roles, retained players']];
  return `<h1 class="pt">More</h1><div class="stack">${it.map(i=>`<button class="pk" data-act="tab" data-t="${i[0]}" style="align-items:center"><div style="display:flex;gap:12px;align-items:center"><span style="color:var(--ac)">${ic(i[0])}</span><div><b>${i[1]}</b><div class="mu" style="font-size:12px">${i[2]}</div></div></div><span class="mu">›</span></button>`).join('')}
   <button class="btn2" data-act="logout" style="color:var(--rd);height:48px">Log out</button></div>`;

/* ---------- sheets ---------- */
function sheetView(me,T,pl){
  if(!S.sheet)return '';
  let title='',body='';
  if(S.sheet==='chat'){title='Ask the assistant';body=chatBody();}
  else if(S.sheet==='team'){const t=T.find(x=>x.id===S.teamSel)||T[0];title=t.name;body=teamDetail(t,me);}
  else if(S.sheet==='sold'){title='Sold? Record it';body=saleForm(T,false,'sd');}
  else if(S.sheet==='picker'){
    title='Choose player';const ql=S.q.toLowerCase();
    const rows=unsoldList().map(x=>({x,v:ev(x,me,pl)})).filter(o=>(!ql||o.x.name.toLowerCase().includes(ql))&&(S.qf==='all'||(S.qf==='bid'?!o.v.skip:o.v.skip)));
    body=`<input id="qs" class="fld" data-in="q" placeholder="Search player" aria-label="Search player" value="${esc(S.q)}">
     <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:6px">${[['all','All'],['bid','Bid'],['skip','Skip']].map(f=>`<button class="btn2" data-act="qf" data-f="${f[0]}" style="height:38px;${S.qf===f[0]?'background:var(--acs);border-color:var(--ac);color:var(--ac)':''}">${f[1]}</button>`).join('')}</div>
     <div>${rows.map(o=>`<button class="row" data-act="pickclose" data-i="${o.x.i}" style="width:100%;background:none;border:0;border-bottom:1px solid #EFEDF8;text-align:left;padding:10px 0"><span><b>${o.x.name}</b><br><span class="mu" style="font-size:12px">${o.x.role} · ${nat(o.x)} · ${ageS(o.x)} · score ${o.x.score}</span></span><b class="${o.v.skip?'rd':'gr'}" style="font-size:17px">${o.v.skip?'Skip':fmt(o.v.ceil)}</b></button>`).join('')||'<div class="mu">No players match.</div>'}</div>`;
  }
  return `<div class="ov" data-act="closesheet"></div><div class="sheet ${S.sheet==='chat'?'chat':''} ${S.sheet==='team'?'big':''}" role="dialog" aria-label="${title}"><div class="grab"></div><div class="sh"><b>${title}</b><button class="btn2" data-act="closesheet" aria-label="Close" style="height:36px;padding:0 10px">${ic('x')}</button></div><div class="sb">${body}</div></div>`;
}

function pickHtml(x,me,pl){const e=ev(x,me,pl);return `<div class="pick"><b>${x.name}</b><span style="font-size:12px">${x.role} · ${nat(x)} · score ${x.score} · starts ${fmt(x.base)} · fair ${fmt(x.fair)}</span><b style="color:${e.skip?'var(--rd)':'var(--gr)'}">${e.skip?'Skip':'Bid up to '+fmt(e.ceil)}</b></div>`;}
function botReply(q){
  const s=q.toLowerCase(),T=teams(),me=T.find(t=>t.id===S.me),pl=plan(me),p=P[S.pid],e=ev(p,me,pl),k=p.ri;
  const role=/fast|pace/.test(s)?3:/spin/.test(s)?4:/all.?round/.test(s)?2:/keeper|wicket/.test(s)?1:/bat/.test(s)?0:-1;
  const ind=/indian/.test(s),ovs=/overseas|foreign/.test(s),m=s.match(/under\s*(\d+(\.\d+)?)/),lim=m?parseFloat(m[1]):null;
  if(/(what|explain|mean).*(score|rating)|score.*mean/.test(s))return `Score is a 0 to 100 rating of how good a player is. Higher is better. ${p.name} has ${p.score}. It comes from his IPL runs, strike rate, wickets and economy. Recent seasons count more.`;
  if(/squad size|quad size/.test(s))return `Squad size is how many players are in your team. The limit is ${S.rules.squad}. You have ${S.rules.squad-me.spots} now.`;
  if(/^(hi|hello|hey)\b/.test(s))return 'Hi! Try: "Why this limit?", "Who else wants him?" or "best Indian fast bowlers under 2 crore".';
  if(/why|explain|reason/.test(s)){
    return `${p.name}: ${e.skip?'SKIP':'bid up to '+fmt(e.ceil)}. ${e.reason} Fair price is ${fmt(p.fair)}. Your limit is fair price plus 15% at most. It also keeps enough money for your other empty spots, and follows your role plan.`;
  }
  if(/who else|rivals?\b|compete|against|want him/.test(s)&&role<0){
    const others=T.filter(t=>t.id!==me.id),can=others.filter(t=>afford(t,p)),need=can.filter(t=>needs(t,k));
    return `${can.length} rivals can afford ${p.name}: ${can.map(t=>t.id).join(', ')||'none'}. ${need.length?'These need a '+p.role.toLowerCase()+': '+need.map(t=>t.id).join(', ')+'.':'None of them need his role.'}`;
  }
  if(/cheaper|similar|alternative/.test(s)){
    const l=unsoldList().filter(x=>x.i!==p.i&&x.ri===k&&x.fair<p.fair).sort((a,b)=>Math.abs(a.score-p.score)-Math.abs(b.score-p.score)).slice(0,3);
    return l.length?`Cheaper ${p.role.toLowerCase()}s like ${p.name}:`+l.map(x=>pickHtml(x,me,pl)).join(''):'No cheaper unsold player in this role.';
  }
  if(/most money|richest|biggest purse|highest purse/.test(s)){
    const l=T.slice().sort((a,b)=>b.money-a.money).slice(0,3);return 'Most money left: '+l.map(t=>`${t.id} ${fmt(t.money)}`).join(', ')+'.';
  }
  if(/roles?.*(need|gap|missing)|still need|what do i need/.test(s)){
    const n=ROLES.map((r,j)=>({r,g:S.want[j]-me.have[j]})).filter(x=>x.g>0);return n.length?'You still need: '+n.map(x=>`${x.g} ${x.r.toLowerCase()}${x.g>1?'s':''}`).join(', ')+'.':'Your role plan is full.';
  }
  if(/who needs|which team/.test(s)&&role>=0){
    const l=T.filter(t=>t.id!==me.id&&needs(t,role)).sort((a,b)=>b.money-a.money).slice(0,5);
    return `Teams that still need ${ROLES[role].toLowerCase()}s: `+l.map(t=>`${t.id} (need ${S.want[role]-t.have[role]}, ${fmt(t.money)} left)`).join(', ')+'.';
  }
  if(/block|current|should i bid|this player/.test(s))return `${p.name}: ${e.skip?'SKIP':'BID up to '+fmt(e.ceil)}. ${e.reason}`;
  if(/money|budget|purse|how much/.test(s)&&role<0)return `You have ${fmt(me.money)}, ${me.spots} spots and ${me.os} overseas spots left.`;
  if(role>=0||ind||ovs||lim!==null||/best|top|cheap|afford/.test(s)){
    let l=unsoldList().filter(x=>(role<0||x.ri===role)&&(!ind||!x.os)&&(!ovs||x.os)&&(lim===null||x.base<lim));
    if(/afford/.test(s))l=l.filter(x=>!ev(x,me,pl).skip);
    l=l.sort((a,b)=>b.score-a.score).slice(0,4);
    if(!l.length)return 'I found no unsold players for that. Try a wider price or role.';
    return `${lim!==null?'Unsold players starting under '+lim+' cr':'Best unsold players'}, best score first:`+l.map(x=>pickHtml(x,me,pl)).join('');
  }
  return 'Try: "Why this limit?", "Who else wants him?" or "best Indian fast bowlers under 2 crore".';
}
function hootieContext(){

  return [`MY TEAM: ${me.name}. Money left ${fmt(me.money)}, spots ${me.spots}, overseas spots ${me.os}. Last season ${me.pos}. Weak area: ${me.batRank>=me.bowlRank?'batting':'bowling'}.`,

}

function noiseB(c,d){const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;return b;}
function sBoom(c,t,v){
  const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.35);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.55);
  const s=c.createBufferSource();s.buffer=noiseB(c,.4);const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=1000;
  const g2=c.createGain();g2.gain.setValueAtTime(v*.7,t);g2.gain.exponentialRampToValueAtTime(.001,t+.4);s.connect(f);f.connect(g2);g2.connect(c.destination);s.start(t);
}
function sCrackle(c,t,v){
  for(let i=0;i<14;i++){
    const tt=t+.05+i*.045+Math.random()*.03,s=c.createBufferSource();s.buffer=noiseB(c,.03);
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2500;const g=c.createGain();g.gain.setValueAtTime(v*(1-i/18),tt);g.gain.exponentialRampToValueAtTime(.001,tt+.03);
    s.connect(f);f.connect(g);g.connect(c.destination);s.start(tt);
  }
}
function sCheer(c,t,d,v){
  const s=c.createBufferSource();s.buffer=noiseB(c,d);const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=.7;
  const g=c.createGain();g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(v,t+.6);g.gain.linearRampToValueAtTime(v*.6,t+d*.6);g.gain.linearRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
}
function sJingle(c,t,v){
  [523.25,659.25,783.99,1046.5,783.99,1046.5].forEach((fr,i)=>{
    const o=c.createOscillator(),g=c.createGain(),tt=t+i*.14;o.type='triangle';o.frequency.value=fr;
    g.gain.setValueAtTime(.001,tt);g.gain.linearRampToValueAtTime(v,tt+.02);g.gain.exponentialRampToValueAtTime(.001,tt+.3);
    o.connect(g);g.connect(c.destination);o.start(tt);o.stop(tt+.32);
  });
}

  else if(a==='login'){musicStop();S.me=S.loginTeam;loadS(S.me);S.sale.t=S.me==='MI'?'CSK':'MI';S.screen='app';S.tab='setup';}
  else if(a==='logout'){S.screen='login';setTimeout(()=>{if(S.music)musicStart();},50);S.sheet=null;S.chatOpen=false;}
  else if(a==='tab'){S.tab=b.dataset.t;S.saleMsg='';window.scrollTo(0,0);}
  else if(a==='type'){S.type=b.dataset.t;S.doneErr='';}
  else if(a==='done'){
    const pt=S.pct.reduce((x,y)=>x+y,0),wt2=S.want.reduce((x,y)=>x+y,0);
    if(pt!==100)S.doneErr='Spend split must add up to 100%. It is '+pt+'% now.';
    else if(wt2>S.rules.squad)S.doneErr='Target roles add up to '+wt2+'. Your squad size is '+S.rules.squad+'.';
    else if(S.extraRet.length>maxRet())S.doneErr='Too many retained players for a '+S.type+' auction.';
    else if(S.budget<=0)S.doneErr='Your budget is zero or less. Check retained players and purse.';
    else{S.doneErr='';S.tab='bid';window.scrollTo(0,0);}
  }
  else if(a==='pick')setPid(+b.dataset.i);
  else if(a==='pickclose'){setPid(+b.dataset.i);S.sheet=null;S.tab='bid';window.scrollTo(0,0);}
  else if(a==='pick-bid'){setPid(+b.dataset.i);S.tab='bid';window.scrollTo(0,0);}
  else if(a==='sheet'){S.sheet=b.dataset.s;if(b.dataset.t)S.teamSel=b.dataset.t;if(S.sheet==='picker'){S.q='';S.qf='all';}}
  else if(a==='closesheet')S.sheet=null;
  else if(a==='qf')S.qf=b.dataset.f;
  else if(a==='cmp'){S.cB=S.cA;S.cA=+b.dataset.i;}
  else if(a==='chat'){S.chatOpen=!S.chatOpen;render(S.chatOpen&&wide());return;}
  else if(a==='snd'){S.sound=!S.sound;if(S.sound)actx();}
  else if(a==='mus'){S.music=!S.music;if(S.music)musicStart();else musicStop();}
  else if(a==='delret'){{const r=S.extraRet.splice(+b.dataset.x,1)[0];if(r)S.budget=Math.round((S.budget+r.price)*100)/100;}}
  else if(a==='save'){
    const price=parseFloat(S.sale.price);if(isNaN(price)){render();return;}
    const p=P[S.pid],buyer=S.sale.t,bt=teams().find(x=>x.id===buyer);
    if(price<=0){toast('Type a price above 0.');render();return;}
    if(bt.spots<=0){toast(buyer+' squad is full. Sale not saved.');render();return;}
    if(p.os&&bt.os<=0){toast(buyer+' has no overseas spot left. Sale not saved.');render();return;}
    if(price>bt.money){toast(buyer+' has only '+fmt(bt.money)+' left. Sale not saved.');render();return;}
    S.sales.push([p.i,buyer,price]);
    const msg=`${p.name} to ${buyer} for ${fmt(price)}. Advice updated.`;
    step(1);S.sheet=null;toast(msg);celebrate(p,buyer,price);
  }
  else if(a==='undo'){const s=S.sales.pop();if(s){setPid(s[0]);S.sale.t=s[1];S.sheet=null;toast(`Undone: ${P[s[0]].name} is back on the list.`);}}
  else if(a==='addret'){
    let n=document.getElementById('rn').value.trim();const ps=document.getElementById('rp').value.trim(),pr=parseFloat(ps);
    let role=document.getElementById('rr').value,nt=document.getElementById('rt').value;
    const me0=teams().find(t=>t.id===S.me),pi=P.findIndex(x=>x.name.toLowerCase()===n.toLowerCase());
    if(pi>=0){n=P[pi].name;role=P[pi].role;nt=nat(P[pi]);}
    S.rf={n,p:ps,r:role,t:nt};
    if(!n)S.retErr='Type the player name.';
    else if(isNaN(pr)||pr<=0)S.retErr='Type the price in crore, like 4.5.';
    else if(S.extraRet.length>=maxRet())S.retErr=S.type==='Mega'?'Mega auction: you can retain at most 6 players.':'Retention limit reached.';
    else if(S.extraRet.some(r=>r.name.toLowerCase()===n.toLowerCase()))S.retErr=n+' is already in your retained list.';
    else if(pi>=0&&!isUnsold(pi))S.retErr=n+' is already sold or retained.';
    else if(me0.spots<=0)S.retErr='Your squad is full. No spot left.';
    else if(nt==='Overseas'&&me0.os<=0)S.retErr='Your overseas spots are full.';
    else if(pr>S.budget)S.retErr='Not enough budget. You have '+fmt(S.budget)+' left.';
    else{S.extraRet.push({name:n,role,nat:nt,price:pr,pi:pi>=0?pi:undefined});S.budget=Math.round((S.budget-pr)*100)/100;S.retErr='';S.doneErr='';S.rf={n:'',p:'',r:ROLES[0],t:'Indian'};toast(n+' added as retained.');if(pi>=0&&S.pid===pi){const l=unsoldList();if(l.length)setPid(l[0].i);}}
  }
  else if(a==='ask'){ask(b.dataset.q);return;}
  else if(a==='send'){ask(document.getElementById('cq').value);return;}
  render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='cq'){ask(e.target.value);return;}
  if(e.key==='Escape'){if(fxStop){fxStop();return;}if(S.sheet){S.sheet=null;render();return;}if(S.chatOpen){S.chatOpen=false;render();return;}}
  if(S.screen!=='app'||S.tab!=='bid'||S.sheet)return;
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==='ArrowRight'){step(1);render();}else if(e.key==='ArrowLeft'){step(-1);render();}
});
document.addEventListener('input',e=>{
  if(e.target.dataset&&e.target.dataset.in==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('qs');if(i){i.focus();i.setSelectionRange(pos,pos);}}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.in;if(!k||k==='q')return;const v=e.target.value;
  if(k==='pid')setPid(+v);
  else if(k==='saleT'){S.sale.t=v;S.saleMsg='';}
  else if(k==='salePrice'){S.sale.price=v;S.saleMsg='';}
  else if(k==='budget'){const n=parseFloat(v);if(!isNaN(n))S.budget=n;}
  else if(k==='rPurse'){const n=parseFloat(v);if(!isNaN(n)){S.budget=Math.round((S.budget+n-S.rules.purse)*100)/100;S.rules.purse=n;}}
  else if(/^r[ms]_/.test(k)){const id=k.slice(3),n=parseFloat(v);S.rival[id]=S.rival[id]||{};if(isNaN(n)||v==='')delete S.rival[id][k[1]==='m'?'money':'spots'];else S.rival[id][k[1]==='m'?'money':'spots']=k[1]==='m'?n:Math.round(n);}
  else if(k==='rSquad'){const n=parseInt(v,10);if(!isNaN(n))S.rules.squad=Math.min(25,Math.max(18,n));}
  else if(k==='rOs'){const n=parseInt(v,10);if(!isNaN(n))S.rules.os=Math.max(0,n);}
  else if(k==='rLow'){const n=parseFloat(v);if(!isNaN(n))S.rules.low=n;}
  else if(/^want\d$/.test(k)){let n=parseInt(v,10);if(!isNaN(n)){const j=+k[4],others=S.want.reduce((x,y,q)=>q===j?x:x+y,0),room=Math.max(0,S.rules.squad-others);n=Math.max(0,n);if(n>room){n=room;toast('Squad size is '+S.rules.squad+'. Highest you can set here is '+room+'.');}S.want[j]=n;}S.doneErr='';}
  else if(/^pct\d$/.test(k)){const n=parseInt(v,10);if(!isNaN(n))S.pct[+k[3]]=Math.min(100,Math.max(0,n));S.doneErr='';}
  else if(k==='cA'||k==='cB')S[k]=+v;
  else S[k]=v;
  render();
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(wide()!==lastWide){lastWide=wide();render();}},150);});
render();
</script>
</body>
</html>
